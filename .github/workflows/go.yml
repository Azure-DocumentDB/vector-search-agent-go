name: Offline Go checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.9', 'stable']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Locked dependencies
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Build, unit and race checks (local mocks only)
        run: |
          go build ./...
          go test -race -count=1 -timeout=2m ./...
          go vet ./...
      - name: Vulnerability audit
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Live gate refuses missing opt-in (no Azure credentials)
        shell: bash
        run: |
          if AGENT_LIVE_TEST= go test -tags=integration ./internal/app -run '^TestLiveAgent$' -count=1 >live-gate.log 2>&1; then
            echo 'Live gate accepted missing opt-in'
            exit 1
          fi
          grep -q 'requires AGENT_LIVE_TEST=1; no network calls made' live-gate.log
